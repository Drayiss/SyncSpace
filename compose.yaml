name: syncspace
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: syncspace
      POSTGRES_USER: syncspace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syncspace_local_only}
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U syncspace -d syncspace']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--maxmemory', '128mb', '--maxmemory-policy', 'allkeys-lru']
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      ConnectionStrings__Postgres: Host=postgres;Database=syncspace;Username=syncspace;Password=${POSTGRES_PASSWORD:-syncspace_local_only}
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      AllowedOrigins: http://localhost:${API_PORT:-5080},http://127.0.0.1:${API_PORT:-5080}
    ports: ['127.0.0.1:${API_PORT:-5080}:8080']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  api2:
    profiles: ['scale']
    build: .
    environment:
      ConnectionStrings__Postgres: Host=postgres;Database=syncspace;Username=syncspace;Password=${POSTGRES_PASSWORD:-syncspace_local_only}
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      AllowedOrigins: http://localhost:5081,http://127.0.0.1:5081
    ports: ['127.0.0.1:5081:8080']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  jaeger:
    image: jaegertracing/jaeger:2.10.0
    profiles: ['observability']
    ports: ['127.0.0.1:16686:16686', '127.0.0.1:4317:4317']
volumes:
  postgres-data:
